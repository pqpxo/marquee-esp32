# version 4
services:
  marquee:
    build: .
    image: marquee:esp32-enhanced-v3
    container_name: marquee
    network_mode: host
    restart: unless-stopped
    environment:
      HUB_IP: ""                                   # optional — pick your Hub in the settings UI instead
      PAGE_URL: "http://192.168.1.10:8084/image"   # this server's LAN IP — the Hub loads this, so localhost won't work
      PLEX_HOST: "http://localhost:32400"          # keep localhost if Plex runs on this machine
      PLEX_TOKEN: ""
      PLEX_USERS: ""   # comma-separated usernames; empty = everyone. A list typed on the settings page replaces this.
      BLOCK_TAGS: ""   # do-not-cast words matched against genres/tags, e.g. "adult, xxx, 18+"; empty = cast everything
      TMDB_API_KEY: ""
      # --- Media backend (optional) ---
      # All of these can also be set on the settings page (backend dropdown,
      # server address, API key) — the page wins, env is the default.
      MEDIA_BACKEND: ""   # plex (default) | emby | jellyfin
      EMBY_HOST: ""           # e.g. http://localhost:8096 (when emby)
      EMBY_API_KEY: ""        # Emby API key (when emby)
      JELLYFIN_HOST: ""       # e.g. http://localhost:8096 (when jellyfin; the EMBY_ pair works too)
      JELLYFIN_API_KEY: ""    # Jellyfin API key (when jellyfin)
    volumes:
      - ./data:/config

  # OPTIONAL ESP-panel sidecar. Renders the real card to card.jpg for an ESP32
  # display. Nest Hub users never need this — it is gated behind the `panel`
  # profile, so a plain `docker compose up` does NOT build or start it.
  #   panel users:  docker compose --profile panel up -d --build
  marquee-shot:
    # Local tag ensures this package's metadata-aware capture logic is used.
    image: marquee-shot:esp32-enhanced-v3
    build: ./sidecar
    container_name: marquee-shot
    profiles: ["panel"]
    network_mode: host
    restart: unless-stopped
    depends_on: [marquee]
    environment:
      MARQUEE_URL: "http://127.0.0.1:8084"
      PANEL_WIDTH: "800"
      PANEL_HEIGHT: "480"
      POLL_EVERY: "1"           # how often to check now-playing (fast reaction)
      PROGRESS_EVERY: "60"      # heartbeat re-render for the progress bar
      JPEG_QUALITY: "85"
      SERVE_PORT: "8088"
