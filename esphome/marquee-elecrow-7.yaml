# =============================================================================
#  Marquee panel — SCREENSHOT MODE   (PRIMARY, pixel-perfect)
#  Board: Elecrow CrowPanel Basic HMI 7.0"  (ESP32-S3-WROOM-1-N4R8, 800x480 RGB)
# =============================================================================
#  WHAT THIS DOES / WHAT YOU SEE:
#    A "dumb display" — it shows the REAL Marquee card, pixel-identical to the
#    Nest Hub, because the marquee-shot sidecar renders the actual card page with
#    headless Chromium and serves it as card.jpg. The panel just fetches that one
#    image full-screen. Nothing is reconstructed on-device (no LVGL, no layout).
#
#  HOME ASSISTANT CONTROLS (all under the ESPHome device page):
#    Controls        Display            switch  master on/off override
#                    Screensaver        switch  enable/disable the sleep timer
#                    Brightness         number  awake backlight level, 5-100%
#                    Screensaver timeout number  1-120 minutes
#    Buttons         Wake display       button  reset the inactivity clock
#                    Refresh card       button  force-refetch card.jpg now
#                    Restart            button
#                    Restart (safe mode) button  recovery if a flash goes bad
#    Sensors         Playing            binary  something is casting
#                    Screen asleep      binary  backlight currently off
#                    WiFi signal / Uptime / ESP temperature / IP / version
#
#    Brightness and both screensaver settings persist across reboots
#    (restore_value), so changing them in HA is permanent — no reflash needed.
#
#  REQUIRES THE SIDECAR (Chromium renderer) running on the Marquee host:
#      docker compose --profile panel up -d
#    It serves:  /card.jpg  (the 800x480 card)   and
#                /state.json {"ver":N,"cver":N,"playing":bool,"paused":bool}
#
#  PER-INSTALL: set `sidecar_host` below, and the `wifi:` block (secrets).
# =============================================================================
#  CHANGELOG (local)
#    2026-08-16 d: exposed everything to Home Assistant — Display and Screensaver
#                  switches, Brightness and Screensaver-timeout numbers, Wake /
#                  Refresh / Restart buttons, and diagnostic sensors. Brightness
#                  and timeout moved OUT of the YAML into restored number
#                  entities, so they are tunable live. The physical `light` is
#                  now `internal: true`: apply_backlight is the only writer, and
#                  exposing it as well would let HA fight the script for control.
#    2026-08-16 c: backlight always 100% when awake (was 40% playing / 100%
#                  paused). Added a 5-minute inactivity screensaver.
#    2026-08-16 b: sidecar_port 8084 -> 8088. 8084 is MARQUEE's port; the
#                  sidecar's SERVE_PORT in compose.yaml is 8088.
#    2026-08-16 b: poll URL reverted /now-playing.json -> /state.json. Marquee's
#                  now-playing.json has no `ver`/`cver` keys, so both parsed as
#                  -1, `ver != prev_ver` was never true, card_dirty never set,
#                  and the card was never fetched or drawn.
# =============================================================================

substitutions:
  sidecar_host: "192.168.1.21"     # <-- host running marquee-shot (your Marquee box)
  sidecar_port: "8088"             # marquee-shot SERVE_PORT (/card.jpg + /state.json)
                                   # NOT 8084 — that is Marquee's own web UI.
  poll_every: "2s"                 # poll the tiny /state.json. NOTE: 1s over-polls — a
                                   # card download+decode+redraw can't finish in 1s, so it
                                   # backs up and gets SLOWER. 2s is the sweet spot.
  # Brightness and screensaver timeout are NOT set here any more — they are HA
  # number entities (see `number:` below) with their defaults as initial_value.


# =============================================================================
#  PART 1 — ESP32 / CrowPanel HARDWARE
# =============================================================================

esphome:
  name: marquee-panel
  friendly_name: Marquee Panel
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi     # QIO flash + OPI (octal) PSRAM
    board_build.flash_mode: dio
  on_boot:
    # Start the inactivity clock at boot so the panel doesn't sleep instantly
    # (last_activity_ms would otherwise sit at 0 while millis() runs away).
    priority: -100
    then:
      - lambda: "id(last_activity_ms) = millis();"
      - script.execute: apply_backlight

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    # Pin IDF 5.5.1: ESPHome's default (5.5.x >= 5.5.2) has the wifi regression
    # (esphome#13443) -> 'Association Expired', flaky/no association. 5.5.1 is the
    # last good wifi build and still satisfies i2c's >= 5.4.2 requirement.
    version: 5.5.1
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y        # octal-PSRAM tuning for this board
      CONFIG_SPIRAM_RODATA: y

# PSRAM is REQUIRED (N4R8 = 8 MB OCTAL): the 800x480x2 (~768 KB) framebuffer +
# JPEG decode buffer for card.jpg live here, not in internal RAM.
psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none            # keep the radio up — avoids 'Association Expired' churn
  # DHCP by default. Optional: pin a static IP so the panel is easy to find for
  # OTA — uncomment and set to YOUR LAN.
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0

logger:
  # Force UART0 (GPIO43/44 -> CH340 -> /dev/ttyUSB0). ESPHome 2026.7 defaults the
  # console to USB_SERIAL_JTAG, whose pins (GPIO19/20) ARE this board's touch-i2c
  # bus -> i2c init kills the console. UART0 is the stable, non-conflicting channel.
  hardware_uart: UART0

api:
ota:
  - platform: esphome

# Safe mode gives you the "Restart (safe mode)" button below: boots with WiFi +
# OTA only, so a bad config can be recovered without USB.
safe_mode:

http_request:
  id: http
  timeout: 8s
  watchdog_timeout: 12s
  useragent: marquee-panel
  verify_ssl: false                # sidecar is plain HTTP on the LAN

# Backlight on GPIO2.
# INTERNAL on purpose: apply_backlight (below) rewrites this every poll tick, so
# a light entity in HA would be overwritten within ~2s of any manual change.
# Use the `Display` switch and `Brightness` number instead — they feed the script.
output:
  - platform: ledc
    pin: 2
    frequency: 1220Hz
    id: backlight_pwm
light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    internal: true
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# Capacitive touch (GT911) shares this i2c bus — usable now that the console is
# on UART0 (GPIO19/20 are free). `scan: false` = don't enumerate at boot.
i2c:
  sda: 19
  scl: 20
  scan: false     # GT911 answers at the default 0x5D (polled touch works)

# Tap-to-wake — the primary way to dismiss the screensaver.
# CAVEAT: `interrupt_pin: 38` was tried and CRASHED the boot (OTA rollback), so
# it's removed. This polled config boots but touch may NOT register yet; the
# correct GT911 wiring for this board (interrupt/reset pin + i2c address 0x5D vs
# 0x14) still needs confirming (espboards PR #1494 / schematic). Until then use
# the "Wake display" button in HA; the screensaver still wakes on a new title.
touchscreen:
  - platform: gt911
    id: touch
    on_touch:
      - lambda: |-
          id(last_activity_ms) = millis();
          ESP_LOGI("panel", "touch -> waking");
      - script.execute: apply_backlight

# RGB parallel panel (Elecrow CrowPanel 7.0" timing/pins — verify vs YOUR unit).
display:
  - platform: rpi_dpi_rgb
    id: panel
    update_interval: never         # we redraw manually when a new card arrives
    auto_clear_enabled: false
    color_order: RGB
    pclk_inverted: true
    dimensions: {width: 800, height: 480}
    de_pin: 41
    hsync_pin: 39
    vsync_pin: 40
    pclk_pin: 0
    hsync_front_porch: 40
    hsync_pulse_width: 48
    hsync_back_porch: 13
    vsync_front_porch: 1
    vsync_pulse_width: 31
    vsync_back_porch: 13
    data_pins:
      red:   [14, 21, 47, 48, 45]
      green: [9, 46, 3, 8, 16, 1]
      blue:  [15, 7, 6, 5, 4]
    # Trivial renderer: blit the fetched card full-screen, or black if none yet.
    # Note this keeps running while the screensaver has the backlight off, so
    # whatever is on the glass is already current the moment you wake it.
    pages:
      - id: page_card
        lambda: |-
          if (id(card_img).get_width() > 0) it.image(0, 0, id(card_img));
          else it.fill(Color::BLACK);


# =============================================================================
#  PART 2 — HOME ASSISTANT CONTROLS
#  Everything tunable lives here as a real entity, so nothing below needs a
#  reflash to change. All three settings restore across reboots.
# =============================================================================

number:
  - platform: template
    name: "Brightness"
    id: awake_brightness
    icon: mdi:brightness-6
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 100          # your requested default: full brightness
    min_value: 5                # not 0 — use the Display switch to turn it off
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    on_value:
      - script.execute: apply_backlight

  - platform: template
    name: "Screensaver timeout"
    id: screensaver_minutes
    icon: mdi:timer-outline
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 5            # your requested default: 5 minutes
    min_value: 1
    max_value: 120
    step: 1
    unit_of_measurement: "min"
    mode: box
    on_value:
      # Changing the timeout restarts the clock, so shortening it can't
      # instantly blank a screen you're looking at.
      - lambda: "id(last_activity_ms) = millis();"
      - script.execute: apply_backlight

switch:
  - platform: template
    name: "Display"
    id: display_enabled
    icon: mdi:television
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: "id(last_activity_ms) = millis();"
      - script.execute: apply_backlight
    turn_off_action:
      - script.execute: apply_backlight

  - platform: template
    name: "Screensaver"
    id: screensaver_enabled
    icon: mdi:monitor-shimmer
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: "id(last_activity_ms) = millis();"
      - script.execute: apply_backlight
    turn_off_action:
      - script.execute: apply_backlight

button:
  - platform: template
    name: "Wake display"
    icon: mdi:gesture-tap
    on_press:
      - lambda: |-
          id(last_activity_ms) = millis();
          ESP_LOGI("panel", "wake button -> waking");
      - script.execute: apply_backlight

  - platform: template
    name: "Refresh card"
    icon: mdi:refresh
    on_press:
      - component.update: card_img

  - platform: restart
    name: "Restart"
    entity_category: diagnostic

  - platform: safe_mode
    name: "Restart (safe mode)"
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Playing"
    icon: mdi:play-circle
    lambda: "return id(now_playing);"

  - platform: template
    name: "Screen asleep"
    icon: mdi:sleep
    entity_category: diagnostic
    lambda: "return id(bl_level) == 0;"

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

  - platform: internal_temperature
    name: "ESP temperature"
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "ESPHome version"
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "IP address"
      entity_category: diagnostic


# =============================================================================
#  PART 3 — MARQUEE CARD  (application logic)
# =============================================================================

globals:
  - {id: prev_ver,         type: int,      restore_value: no, initial_value: "-1"}    # last /state.json frame ver
  - {id: prev_cver,        type: int,      restore_value: no, initial_value: "-1"}    # last content ver (title/episode)
  - {id: now_playing,      type: bool,     restore_value: no, initial_value: "false"}
  - {id: now_paused,       type: bool,     restore_value: no, initial_value: "false"}
  - {id: card_dirty,       type: bool,     restore_value: no, initial_value: "false"} # ver changed -> refetch
  - {id: redraw_pending,   type: bool,     restore_value: no, initial_value: "false"} # new image decoded -> redraw
  - {id: last_activity_ms, type: uint32_t, restore_value: no, initial_value: "0"}     # millis() of last touch / content change
  - {id: bl_level,         type: int,      restore_value: no, initial_value: "-1"}    # last applied backlight %
  - {id: asleep_logged,    type: bool,     restore_value: no, initial_value: "false"} # so the sleep line logs once

# The card image itself, fetched on demand from the sidecar (not on a timer).
online_image:
  - id: card_img
    url: "http://${sidecar_host}:${sidecar_port}/card.jpg"
    format: JPEG
    type: RGB565
    resize: 800x480
    update_interval: never
    on_download_finished:
      - lambda: "id(redraw_pending) = true;"

# Backlight policy in ONE place so touch, the HA controls, the poll loop, and
# card redraws all use the same rule, in priority order:
#   Display switch off         -> OFF
#   nothing playing            -> OFF
#   screensaver on and expired -> OFF
#   otherwise                  -> Brightness number (%)
script:
  - id: apply_backlight
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t idle_for = now - id(last_activity_ms);

          // Number entities read NAN until restore/init completes — fall back to
          // the documented defaults rather than blanking the panel.
          float bright_f = id(awake_brightness).state;
          if (isnan(bright_f)) bright_f = 100.0f;
          float mins_f = id(screensaver_minutes).state;
          if (isnan(mins_f)) mins_f = 5.0f;
          const uint32_t limit = (uint32_t)(mins_f * 60000.0f);

          int target;
          if (!id(display_enabled).state) {
            target = 0;                                        // master off
          } else if (!id(now_playing)) {
            target = 0;                                        // nothing casting
          } else if (id(screensaver_enabled).state && limit > 0 && idle_for >= limit) {
            target = 0;                                        // screensaver
            if (!id(asleep_logged)) {
              ESP_LOGI("panel", "screensaver: %u ms inactive, backlight off", idle_for);
              id(asleep_logged) = true;
            }
          } else {
            target = (int)bright_f;
            id(asleep_logged) = false;
          }

          if (target != id(bl_level)) {
            id(bl_level) = target;
            if (target == 0) {
              id(backlight).turn_off().perform();
            } else {
              auto call = id(backlight).turn_on();
              call.set_brightness(target / 100.0f);
              call.perform();
            }
          }

# The poll loop: check the sidecar's cheap /state.json every ${poll_every}; pull
# the card only when its frame version bumps.
#
# WHAT COUNTS AS ACTIVITY (resets the screensaver clock):
#   - a touch, the Wake button, or turning the Display switch on
#   - `cver` changing = a NEW TITLE OR EPISODE
#   - play/pause transitions
# WHAT DOES NOT:
#   - `ver` changing. The sidecar bumps `ver` on every re-render, including the
#     PROGRESS_EVERY heartbeat (60s by default). Treating that as activity would
#     reset the clock every minute and the screensaver would never fire.
interval:
  - interval: ${poll_every}
    then:
      - http_request.get:
          url: "http://${sidecar_host}:${sidecar_port}/state.json"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  int ver = -1, cver = -1; bool playing = false, paused = false;
                  json::parse_json(body, [&](JsonObject root) -> bool {
                    ver     = root["ver"]     | -1;
                    cver    = root["cver"]    | -1;
                    playing = root["playing"] | false;
                    paused  = root["paused"]  | false;
                    return true;
                  });

                  // Play/pause transition = activity.
                  if (playing != id(now_playing) || paused != id(now_paused)) {
                    id(last_activity_ms) = millis();
                  }
                  id(now_playing) = playing;
                  id(now_paused)  = paused;

                  // Frame version bumped -> refetch the card (NOT activity).
                  if (ver != id(prev_ver)) { id(prev_ver) = ver; id(card_dirty) = true; }

                  // Content version bumped -> new title/episode = activity.
                  // Skip the first sync at boot (prev_cver == -1).
                  if (cver != id(prev_cver)) {
                    if (id(prev_cver) != -1) {
                      id(last_activity_ms) = millis();
                      ESP_LOGI("panel", "new title -> waking");
                    }
                    id(prev_cver) = cver;
                  }
              - if:                              # frame changed -> pull the new card
                  condition:
                    lambda: "return id(card_dirty);"
                  then:
                    - lambda: "id(card_dirty) = false;"
                    - component.update: card_img   # blocks ~2s; sets redraw_pending on finish
      # Redraw the freshly-decoded card. This happens whether or not the
      # backlight is on, so waking always reveals a current card.
      - if:
          condition:
            lambda: "return id(redraw_pending);"
          then:
            - lambda: "id(redraw_pending) = false;"
            - component.update: panel
      # Re-evaluate the backlight every tick (this is what trips the screensaver).
      - script.execute: apply_backlight
